<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 | Aydin Ezzatpour</title>
  <meta name="theme-color" content="#09090b">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#09090b;color:#f5f5f6;font-family:Inter,system-ui,sans-serif;text-align:center;padding:24px}
    main{max-width:720px}p:first-child{color:#ef4444;text-transform:uppercase;letter-spacing:.16em;font-size:.8rem;font-weight:700}
    h1{font-size:clamp(4rem,15vw,9rem);line-height:.9;letter-spacing:-.08em;margin:18px 0}p{color:#a1a1aa}
    a{display:inline-block;margin-top:18px;padding:13px 18px;border-radius:11px;background:#ef4444;color:white;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main>
    <p>Page not found</p>
    <h1>404</h1>
    <p>The page you requested does not exist or may have moved.</p>
    <a href="/">Return home</a>
  </main>
</body>
</html>
